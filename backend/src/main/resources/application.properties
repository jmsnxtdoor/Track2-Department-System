spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/track2_department}
spring.datasource.username=${DATABASE_USER:track2_app}
spring.datasource.password=${DATABASE_PASSWORD:department_local_only}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html
app.cors.origin=${CORS_ORIGIN:https://127.0.0.1:5173}
track2.integration.shared-api-key=${TRACK2_INTEGRATION_API_KEY:}
track2.integration.lan.enabled=${TRACK2_LAN_API_ENABLED:false}
track2.integration.lan.bind-address=${TRACK2_LAN_API_BIND_ADDRESS:}
track2.integration.lan.port=${TRACK2_LAN_API_PORT:8443}
track2.integration.lan.keystore=${TRACK2_LAN_API_KEYSTORE:}
track2.integration.lan.keystore-password=${TRACK2_LAN_API_KEYSTORE_PASSWORD:}
external-api.allowed-endpoints=${EXTERNAL_API_ALLOWED_ENDPOINTS:}
external-api.allowed-private-endpoints=${EXTERNAL_API_ALLOWED_PRIVATE_ENDPOINTS:}
app.admin.password=${ADMIN_PASSWORD:}
app.treasurer.password=${TREASURER_PASSWORD:}
app.officer.password=${OFFICER_PASSWORD:}
app.student.password=${STUDENT_PASSWORD:}
